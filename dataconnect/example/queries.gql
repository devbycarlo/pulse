# Example queries for the exercise app (User, WorkoutCategory, Routine, Interval, WorkoutSession).
# Query operations only — mutations live in mutations.gql.

# ---------------------------------------------------------------
# User
# ---------------------------------------------------------------

query GetUser @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    username email profilePhotoUrl
  }
}

query ListUsers @auth(level: PUBLIC, insecureReason: "Public profiles are part of the social feature.") {
  users {
    username profilePhotoUrl
  }
}

# ---------------------------------------------------------------
# WorkoutCategory
# ---------------------------------------------------------------

query GetWorkoutCategory($id: UUID!) @auth(level: USER) {
  workoutCategory(id: $id, where: { userId: { eq_expr: "auth.uid" } }) {
    name
  }
}

query ListMyWorkoutCategories @auth(level: USER) {
  workoutCategories(where: { userId: { eq_expr: "auth.uid" } }) {
    id name
  }
}

# ---------------------------------------------------------------
# Routine
# ---------------------------------------------------------------

query GetRoutine($id: UUID!) @auth(level: USER) {
  routine(id: $id, where: { userId: { eq_expr: "auth.uid" } }) {
    name
    workDurationSeconds
    rounds
    description
  }
}

query ListMyRoutines @auth(level: USER) {
  routines(where: { userId: { eq_expr: "auth.uid" } }) {
    id name
  }
}

# ---------------------------------------------------------------
# Interval
# ---------------------------------------------------------------

query GetInterval($id: UUID!) @auth(level: USER) {
  interval(id: $id, where: { routine: { userId: { eq_expr: "auth.uid" } } }) {
    name
    durationSeconds
    sequenceOrder
  }
}

query ListIntervalsForRoutine($routineId: UUID!) @auth(level: USER) {
  intervals(
    where: {
      routineId: { eq: $routineId }
      routine: { userId: { eq_expr: "auth.uid" } }
    }
  ) {
    name
    sequenceOrder
  }
}

# ---------------------------------------------------------------
# WorkoutSession
# ---------------------------------------------------------------

query GetWorkoutSession($id: UUID!) @auth(level: USER) {
  workoutSession(id: $id, where: { userId: { eq_expr: "auth.uid" } }) {
    completedAt
    totalDurationSeconds
  }
}

query ListMyWorkoutSessions @auth(level: USER) {
  workoutSessions(where: { userId: { eq_expr: "auth.uid" } }) {
    id completedAt totalDurationSeconds
  }
}
