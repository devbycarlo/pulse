# Example mutations for the exercise app (User, WorkoutCategory, Routine, Interval, WorkoutSession).
# Field names are generated from the @table types in dataconnect/schema/schema.gql.
# Use these with the Data Connect CLI: dartctl dataconnect deploy

# ---------------------------------------------------------------
# User
# ---------------------------------------------------------------

# Create a user owned by the authenticated account
mutation CreateUser($username: String!, $email: String!, $profilePhotoUrl: String) @auth(level: USER) {
  user_insert(data: {
    id_expr: "auth.uid",
    username: $username,
    email: $email,
    profilePhotoUrl: $profilePhotoUrl
  })
}

# Update the authenticated user's profile
mutation UpdateUser($username: String, $email: String, $profilePhotoUrl: String) @auth(level: USER) {
  user_update(key: { id_expr: "auth.uid" }, data: {
    username: $username,
    email: $email,
    profilePhotoUrl: $profilePhotoUrl
  })
}

# Delete the authenticated user
mutation DeleteUser @auth(level: USER) {
  user_delete(key: { id_expr: "auth.uid" })
}

# ---------------------------------------------------------------
# WorkoutCategory
# ---------------------------------------------------------------

# Create a workout category for the authenticated user
mutation CreateWorkoutCategory($name: String!) @auth(level: USER) {
  workoutCategory_insert(data: {
    name: $name,
    userId_expr: "auth.uid"
  })
}

# Rename an existing category (scoped to the authenticated user)
mutation UpdateWorkoutCategory($id: UUID!, $name: String!) @auth(level: USER) {
  workoutCategory_update(
    first: { where: { id: { eq: $id }, userId: { eq_expr: "auth.uid" } } }
    data: { name: $name }
  )
}

# Delete a category (scoped to the authenticated user)
mutation DeleteWorkoutCategory($id: UUID!) @auth(level: USER) {
  workoutCategory_delete(
    first: { where: { id: { eq: $id }, userId: { eq_expr: "auth.uid" } } }
  )
}

# ---------------------------------------------------------------
# Routine
# ---------------------------------------------------------------

# Create a routine under a category, owned by the authenticated user
mutation CreateRoutine(
  $name: String!
  $workDurationSeconds: Int!
  $restDurationSeconds: Int!
  $rounds: Int!
  $description: String
  $workoutCategoryId: UUID
) @auth(level: USER) {
  routine_insert(data: {
    name: $name,
    workDurationSeconds: $workDurationSeconds,
    restDurationSeconds: $restDurationSeconds,
    rounds: $rounds,
    description: $description,
    workoutCategoryId: $workoutCategoryId,
    userId_expr: "auth.uid"
  })
}

# Update a routine's name or description (scoped to the authenticated user)
mutation UpdateRoutine($id: UUID!, $name: String, $description: String) @auth(level: USER) {
  routine_update(
    first: { where: { id: { eq: $id }, userId: { eq_expr: "auth.uid" } } }
    data: {
      name: $name,
      description: $description
    }
  )
}

# Delete a routine (scoped to the authenticated user)
mutation DeleteRoutine($id: UUID!) @auth(level: USER) {
  routine_delete(
    first: { where: { id: { eq: $id }, userId: { eq_expr: "auth.uid" } } }
  )
}

# ---------------------------------------------------------------
# Interval
# ---------------------------------------------------------------

# Add an interval to a routine
mutation CreateInterval($name: String!, $durationSeconds: Int!, $sequenceOrder: Int!, $routineId: UUID!) @auth(level: USER) {
  interval_insert(data: {
    name: $name,
    durationSeconds: $durationSeconds,
    sequenceOrder: $sequenceOrder,
    routineId: $routineId,
    userId_expr: "auth.uid"
  })
}

# Change an interval's duration (scoped to the routine's owner)
mutation UpdateInterval($id: UUID!, $durationSeconds: Int) @auth(level: USER) {
  interval_update(
    first: { where: { id: { eq: $id }, routine: { userId: { eq_expr: "auth.uid" } } } }
    data: { durationSeconds: $durationSeconds }
  )
}

# Remove an interval (scoped to the routine's owner)
mutation DeleteInterval($id: UUID!) @auth(level: USER) {
  interval_delete(
    first: { where: { id: { eq: $id }, routine: { userId: { eq_expr: "auth.uid" } } } }
  )
}

# ---------------------------------------------------------------
# WorkoutSession
# ---------------------------------------------------------------

# Record a completed workout session
mutation CreateWorkoutSession(
  $routineId: UUID!
  $completedAt: Timestamp!
  $totalDurationSeconds: Int!
) @auth(level: USER) {
  workoutSession_insert(data: {
    routineId: $routineId,
    completedAt: $completedAt,
    totalDurationSeconds: $totalDurationSeconds,
    userId_expr: "auth.uid"
  })
}

# Adjust the total duration of a recorded session (scoped to the session's owner)
mutation UpdateWorkoutSession($id: UUID!, $totalDurationSeconds: Int!) @auth(level: USER) {
  workoutSession_update(
    first: { where: { id: { eq: $id }, userId: { eq_expr: "auth.uid" } } }
    data: { totalDurationSeconds: $totalDurationSeconds }
  )
}

# Delete a recorded session (scoped to the session's owner)
mutation DeleteWorkoutSession($id: UUID!) @auth(level: USER) {
  workoutSession_delete(
    first: { where: { id: { eq: $id }, userId: { eq_expr: "auth.uid" } } }
  )
}
