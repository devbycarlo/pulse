<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --work-color: #22c55e;
      --rest-color: #ef4444;
      --accent: #3b82f6;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      transition: background-color 0.5s ease;
    }

    .app-container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 420px;
      padding: 2rem;
      border-radius: 1.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      gap: 2rem;
      margin: 1rem;
    }

    /* Timer Display */
    .timer-section {
      text-align: center;
    }

    .phase {
      font-size: 1.25rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-weight: 700;
      min-height: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .time-display {
      font-size: 6rem;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    .round-info {
      font-size: 1.125rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      font-weight: 500;
    }

    /* Settings */
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .input-group label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .input-group input {
      width: 100%;
      background-color: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 0.75rem 0.5rem;
      border-radius: 0.75rem;
      text-align: center;
      font-size: 1.25rem;
      font-weight: 600;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: var(--accent);
    }
    
    /* Hide arrows on number inputs */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] { -moz-appearance: textfield; }

    /* Controls */
    .controls {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1rem;
    }

    button {
      padding: 1rem;
      border: none;
      border-radius: 1rem;
      font-size: 1.125rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
      font-family: inherit;
    }

    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-primary { background-color: var(--accent); color: white; }
    .btn-secondary { background-color: rgba(255, 255, 255, 0.1); color: white; }
    
    /* Utility Classes */
    .text-work { color: var(--work-color); }
    .text-rest { color: var(--rest-color); }
    .text-idle { color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="timer-section">
      <div id="phase" class="phase text-idle">READY</div>
      <div id="time-display" class="time-display">00:30</div>
      <div id="round-info" class="round-info">Round 1 / 8</div>
    </div>

    <div class="settings-grid">
      <div class="input-group">
        <label for="work-time">Work (s)</label>
        <input type="number" id="work-time" value="30" min="1">
      </div>
      <div class="input-group">
        <label for="rest-time">Rest (s)</label>
        <input type="number" id="rest-time" value="10" min="1">
      </div>
      <div class="input-group">
        <label for="rounds">Rounds</label>
        <input type="number" id="rounds" value="8" min="1">
      </div>
    </div>

    <div class="controls">
      <button id="start-btn" class="btn-primary">Start Workout</button>
      <button id="reset-btn" class="btn-secondary">Reset</button>
    </div>
  </div>

  <script>
    // State variables
    let workDuration = 30;
    let restDuration = 10;
    let totalRounds = 8;
    
    let currentPhase = 'idle'; // 'idle', 'work', 'rest', 'done'
    let timeLeft = workDuration;
    let currentRound = 1;
    let timerInterval = null;

    // DOM Elements
    const phaseEl = document.getElementById('phase');
    const timeDisplayEl = document.getElementById('time-display');
    const roundInfoEl = document.getElementById('round-info');
    const startBtn = document.getElementById('start-btn');
    const resetBtn = document.getElementById('reset-btn');
    const inputs = {
      work: document.getElementById('work-time'),
      rest: document.getElementById('rest-time'),
      rounds: document.getElementById('rounds')
    };

    // Simple Web Audio API for beeps
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(frequency, duration, type = 'sine') {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
      
      gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      
      oscillator.start(audioCtx.currentTime);
      oscillator.stop(audioCtx.currentTime + duration);
    }

    // Handlers
    function updateSettings() {
      if (currentPhase !== 'idle') return;
      workDuration = parseInt(inputs.work.value) || 30;
      restDuration = parseInt(inputs.rest.value) || 10;
      totalRounds = parseInt(inputs.rounds.value) || 8;
      timeLeft = workDuration;
      updateUI();
    }

    Object.values(inputs).forEach(input => {
      input.addEventListener('input', updateSettings);
    });

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateUI() {
      timeDisplayEl.textContent = formatTime(timeLeft);
      
      if (currentPhase === 'done') {
        roundInfoEl.textContent = 'Workout Complete!';
      } else {
        roundInfoEl.textContent = `Round ${currentRound} / ${totalRounds}`;
      }

      // Update colors and text based on phase
      phaseEl.className = 'phase';
      if (currentPhase === 'work') {
        phaseEl.textContent = 'WORK';
        phaseEl.classList.add('text-work');
        document.body.style.backgroundColor = '#064e3b'; // Dark green
      } else if (currentPhase === 'rest') {
        phaseEl.textContent = 'REST';
        phaseEl.classList.add('text-rest');
        document.body.style.backgroundColor = '#7f1d1d'; // Dark red
      } else if (currentPhase === 'done') {
        phaseEl.textContent = 'DONE';
        phaseEl.classList.add('text-idle');
        document.body.style.backgroundColor = '#0f172a'; // Base dark
      } else {
        phaseEl.textContent = 'READY';
        phaseEl.classList.add('text-idle');
        document.body.style.backgroundColor = '#0f172a';
      }
    }

    function tick() {
      // Play a steady ticking tone
      playBeep(523, 0.1);

      timeLeft--;
      if (timeLeft <= 3 && timeLeft > 0) {
        playBeep(440, 0.15); // Short low beep
      }

      if (timeLeft < 0) {
        playBeep(880, 0.4, 'triangle'); // High alert beep on transition
        
        if (currentPhase === 'work') {
          if (currentRound >= totalRounds) {
            // Finish Workout
            currentPhase = 'done';
            clearInterval(timerInterval);
            timerInterval = null;
            startBtn.textContent = 'Start Workout';
            startBtn.style.backgroundColor = 'var(--accent)';
            Object.values(inputs).forEach(i => i.disabled = false);
            updateUI();
            return;
          } else {
            // Switch to Rest
            currentPhase = 'rest';
            timeLeft = restDuration;
          }
        } else if (currentPhase === 'rest') {
          // Switch to Work
          currentPhase = 'work';
          timeLeft = workDuration;
          currentRound++;
        }
      }
      updateUI();
    }

    function toggleTimer() {
      if (currentPhase === 'done') resetTimer();

      if (timerInterval) {
        // Pause
        clearInterval(timerInterval);
        timerInterval = null;
        startBtn.textContent = 'Resume';
        startBtn.style.backgroundColor = 'var(--accent)';
      } else {
        // Start / Resume
        if (currentPhase === 'idle') {
          currentPhase = 'work';
          Object.values(inputs).forEach(i => i.disabled = true);
          playBeep(880, 0.4, 'triangle'); // Initial start beep
        }
        timerInterval = setInterval(tick, 1000);
        startBtn.textContent = 'Pause';
        startBtn.style.backgroundColor = 'rgba(255,255,255,0.1)';
      }
      updateUI();
    }

    function resetTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      currentPhase = 'idle';
      currentRound = 1;
      timeLeft = workDuration;
      
      Object.values(inputs).forEach(i => i.disabled = false);
      startBtn.textContent = 'Start Workout';
      startBtn.style.backgroundColor = 'var(--accent)';
      updateUI();
    }

    startBtn.addEventListener('click', toggleTimer);
    resetBtn.addEventListener('click', resetTimer);

    // Initialize UI on load
    updateUI();
  </script>
</body>
</html>
